[pytest]
# Without these plugins, `timeout` and `--cov` fail with an unclear error.
required_plugins = pytest-timeout pytest-cov
testpaths = tests
addopts = -ra --strict-markers --strict-config --cov --cov-report=term-missing
timeout = 60
xfail_strict = true
filterwarnings =
    error
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
