# Production defaults. values-local.yaml overrides them for Rancher Desktop.
# Each backing service has `deploy`. Set it to false to use a 3rd-party host.

# Kustomize commonLabels from geometry.dev/apps/dash. They are in every
# selector, and selectors are immutable, so keep them to adopt the prod objects.
commonLabels:
  app.kubernetes.io/name: dash
  app.kubernetes.io/managed-by: argocd

scheme: https
storageClassName: local-path

networkPolicies:
  enabled: true

# The dash api and worker.
dash:
  image: ghcr.io/whatever/dash:sha-fe41f19
  imagePullPolicy: IfNotPresent
  host: dash.geometry.dev
  basicAuth:
    enabled: true
    secret: traefik-basic-auth

postgres:
  deploy: false
  image: pgvector/pgvector:pg16
  storage: 5Gi
  # When deploy is false: a Secret with DASH_DATABASE_URL and NANGO_DATABASE_URL.
  existingSecret: geometry-config

redis:
  deploy: true
  image: redis:8-alpine
  storage: 1Gi
  # When deploy is false: a Secret with REDIS_URL and NANGO_REDIS_URL.
  existingSecret: ""

nango:
  deploy: true
  image: nangohq/nango-server:hosted-0.71.13@sha256:1839c59a2d04479e884328b2852f5aedc7b7c24083f07a2b0381958a1fd83649
  dbSsl: "true"
  host: nango.geometry.dev
  connectHost: nango-connect.geometry.dev
  # When deploy is false, for example https://api.nango.dev and https://connect.nango.dev.
  url: ""
  connectUrl: ""

# The agent the worker runs. model is a Pydantic AI model string.
# baseUrl: an OpenAI-compatible API to send model requests to. Its key is AGENT_API_KEY in dash-agent.
# thinking: minimal, low, medium, high or xhigh. Empty leaves it to the model.
# toolPolicy: tool name (or <server>_*) to never, ask or auto. Unlisted tools are auto.
# mcpServers: [{name, url, exclude: [tool]}], streamable-HTTP MCP servers whose tools the agent gets.
# webSearch: the model's own web search where it has one, DuckDuckGo otherwise.
agent:
  model: bedrock:global.anthropic.claude-opus-5-5
  baseUrl: ""
  thinking: low
  requestLimit: 30
  toolCallLimit: 50
  toolPolicy: {}
  mcpServers: []
  webSearch: true

# The ssh sandbox the agent runs commands in. Only it holds the Nango and GitHub tokens.
sandbox:
  deploy: true
  image: lscr.io/linuxserver/openssh-server:10.2_p1-r0-ls226
  storage: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 2Gi }
  ghVersion: "2.65.0"
  ghArch: amd64

externalSecrets:
  enabled: true
  store: aws-secretsmanager
  items:
    dash:
      key: geometry/dash
      data: [NANGO_DASHBOARD_PASSWORD, NANGO_ENCRYPTION_KEY, NANGO_SECRET_KEY]
    dash-agent-ssh:
      key: geometry/dash
      data:
        PRIVATE_KEY: DASH_SANDBOX_PRIVATE_KEY
    dash-sandbox-ssh:
      key: geometry/dash
      data:
        PUBLIC_KEY: DASH_SANDBOX_PUBLIC_KEY
    dash-github-app:
      key: geometry/dash
      data: [GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY]
    dash-bedrock:
      key: geometry/bedrock
      extract: true
    traefik-basic-auth:
      key: geometry/auth
      extract: true

# Plain Secrets, for clusters with no External Secrets Operator.
# Map of Secret name to its keys and values.
secrets:
  create: false
  values: {}

# `dash scrape` on a schedule. It checks the sources from the Data panel that are due,
# plus these fixed web:<url> sources on every run.
scrape:
  enabled: true
  schedule: "*/5 * * * *"
  sources: []
