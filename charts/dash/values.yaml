global:
  commonLabels:
    app.kubernetes.io/name: dash
    app.kubernetes.io/managed-by: argocd
  scheme: https
  storageClassName: local-path
  networkPolicies:
    enabled: true
  configSecret: geometry-config

dash:
  image:
    repository: ghcr.io/whatever/dash
    tag: ""
    pullPolicy: IfNotPresent
  host: dash.geometry.dev
  basicAuth:
    enabled: true

agent:
  image: nousresearch/hermes-agent:v2026.8.27
  model: hermes-opus
  storage: 20Gi
  host: dash-agent.geometry.dev
  dashboard:
    enabled: true

sandbox:
  image: lscr.io/linuxserver/openssh-server:10.2_p1-r0-ls226
  storage: 10Gi
  ghVersion: "2.65.0"
  ghArch: amd64

nango:
  image: nangohq/nango-server:hosted-0.71.13@sha256:1839c59a2d04479e884328b2852f5aedc7b7c24083f07a2b0381958a1fd83649
  dbSsl: "true"
  host: nango.geometry.dev
  connectHost: nango-connect.geometry.dev

postgres:
  enabled: false
  image: pgvector/pgvector:pg16
  storage: 5Gi

externalSecrets:
  enabled: true
  store: aws-secretsmanager
  items:
    dash:
      key: geometry/dash
      data: [NANGO_DASHBOARD_PASSWORD, NANGO_ENCRYPTION_KEY, NANGO_SECRET_KEY]
    dash-hermes:
      key: geometry/dash
      data: [API_SERVER_KEY]
    dash-agent-env:
      key: geometry/dash
      data: [API_SERVER_KEY]
    dash-agent-ssh:
      key: geometry/dash
      data:
        PRIVATE_KEY: DASH_SANDBOX_PRIVATE_KEY
    dash-sandbox-ssh:
      key: geometry/dash
      data:
        PUBLIC_KEY: DASH_SANDBOX_PUBLIC_KEY
    dash-github-app:
      key: geometry/dash
      data: [GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY]
    dash-bedrock:
      key: geometry/bedrock
      extract: true
    traefik-basic-auth:
      key: geometry/auth
      extract: true

secrets:
  create: false
  values: {}
