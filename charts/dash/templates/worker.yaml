apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash-worker
  labels: {{- include "dash.labels" (list . "dash-worker") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "dash.selectorLabels" (list . "dash-worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dash.selectorLabels" (list . "dash-worker") | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: worker
          image: {{ include "dash.image" . }}
          imagePullPolicy: {{ .Values.dash.imagePullPolicy }}
          args: [worker]
          {{- include "dash.env" . | nindent 10 }}
          {{- if .Values.sandbox.deploy }}
          volumeMounts:
            - name: sandbox-key
              mountPath: /run/secrets/sandbox
              readOnly: true
          {{- end }}
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 768Mi }
      {{- if .Values.sandbox.deploy }}
      volumes:
        # The worker copies the key into a 0600 file of its own before using it.
        - name: sandbox-key
          secret:
            secretName: dash-agent-ssh
            defaultMode: 0444
            items:
              - key: PRIVATE_KEY
                path: id_ed25519
      {{- end }}
