{{- if and .Values.sandbox.deploy .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dash-sandbox
  labels: {{- include "dash.labels" (list . "dash-sandbox") | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "dash.selectorLabels" (list . "dash-sandbox") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "dash.selectorLabels" (list . "dash-worker") | nindent 14 }}
      ports:
        - port: ssh
{{- end }}
