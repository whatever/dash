{{- if .Values.wiki.enabled }}
# Schedule only: `dash dream` queues one dream job and exits. The worker folds the conversations
# since the last dream into the wiki and leaves a note in the inbox.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dash-dream
  labels: {{- include "dash.labels" (list . "dash-dream") | nindent 4 }}
spec:
  schedule: {{ .Values.wiki.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels: {{- include "dash.selectorLabels" (list . "dash-dream") | nindent 12 }}
        spec:
          restartPolicy: Never
          containers:
            - name: dream
              image: {{ include "dash.image" . }}
              imagePullPolicy: {{ .Values.dash.imagePullPolicy }}
              args: [dream]
              envFrom:
                - configMapRef:
                    name: dash-env
              env:
                {{- if not .Values.redis.deploy }}
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.redis.existingSecret }}, key: REDIS_URL }
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { memory: 128Mi }
{{- end }}
