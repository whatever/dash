apiVersion: v1
kind: ConfigMap
metadata:
  name: dash-env
  labels: {{- include "dash.labels" (list . "dash-env") | nindent 4 }}
data:
  PUBLIC_URL: {{ include "dash.url" (list . .Values.dash.host) }}
  {{- if .Values.redis.deploy }}
  REDIS_URL: redis://dash-redis:6379/0
  {{- end }}
  AGENT_MODEL: {{ .Values.agent.model | quote }}
  AGENT_BASE_URL: {{ .Values.agent.baseUrl | quote }}
  AGENT_THINKING: {{ .Values.agent.thinking | quote }}
  AGENT_REQUEST_LIMIT: {{ .Values.agent.requestLimit | quote }}
  AGENT_TOOL_CALL_LIMIT: {{ .Values.agent.toolCallLimit | quote }}
  NANGO_URL: {{ include "dash.nangoUrl" . }}
  NANGO_PUBLIC_URL: {{ include "dash.nangoPublicUrl" . }}
  NANGO_CONNECT_URL: {{ include "dash.nangoConnectUrl" . }}
