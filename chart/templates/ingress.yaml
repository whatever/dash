{{- if .Values.ingress.basicAuth }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: traefik-basic-auth
    realm: geometry.dev
    removeHeader: true
---
{{- end }}
# TLS ends at the ALB (wildcard ACM cert, *.geometry.dev ALIAS), so these
# are plain Host rules for traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dash
  labels:
    {{- include "dash.labels" . | nindent 4 }}
  {{- if .Values.ingress.basicAuth }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-basic-auth@kubernetescrd
  {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dash-api
                port:
                  name: http
{{- if .Values.nango.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dash-nango
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.nango.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dash-nango
                port:
                  name: api
    - host: {{ .Values.nango.connectHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dash-nango
                port:
                  name: connect
{{- end }}
