{{- /* *Strategy/*Policy fields are CRD defaults, pinned to silence ArgoCD drift. */ -}}
{{- $secrets := list
  (dict "name" "dash" "key" .Values.secrets.dash)
  (dict "name" "dash-hermes" "key" .Values.secrets.hermes)
  (dict "name" "dash-bedrock" "key" .Values.secrets.bedrock) }}
{{- if .Values.ingress.basicAuth }}
{{- $secrets = append $secrets (dict "name" "traefik-basic-auth" "key" .Values.secrets.auth) }}
{{- end }}
{{- range $secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "dash.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .key }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
