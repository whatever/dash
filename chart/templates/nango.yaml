{{- if .Values.nango.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash-nango
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dash-nango
  template:
    metadata:
      labels:
        app: dash-nango
    spec:
      containers:
        - name: nango
          image: {{ .Values.nango.image }}
          ports:
            - name: api
              containerPort: 3003
            - name: connect
              containerPort: 3009
          env:
            - name: SERVER_RUN_MODE
              value: DOCKERIZED
            - name: SERVER_PORT
              value: "3003"
            - name: NANGO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.config }}
                  key: {{ .Values.secrets.nangoDatabaseUrlKey }}
            # Encrypts every stored token. Never rotate it: existing
            # connections become unreadable.
            - name: NANGO_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dash
                  key: NANGO_ENCRYPTION_KEY
            - name: NANGO_REDIS_URL
              value: {{ include "dash.redisUrl" . | quote }}
            - name: NANGO_SERVER_URL
              value: https://{{ .Values.nango.host }}
            - name: NANGO_PUBLIC_CONNECT_URL
              value: https://{{ .Values.nango.connectHost }}
            - name: FLAG_SERVE_CONNECT_UI
              value: "true"
            - name: FLAG_AUTH_ENABLED
              value: "false"
            - name: NANGO_DASHBOARD_USERNAME
              value: {{ .Values.nango.dashboardUser | quote }}
            - name: NANGO_DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dash
                  key: NANGO_DASHBOARD_PASSWORD
            - name: TELEMETRY
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.nango.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: api }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: api }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dash-nango
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  selector:
    app: dash-nango
  ports:
    - name: api
      port: 3003
      targetPort: api
    - name: connect
      port: 3009
      targetPort: connect
{{- end }}
