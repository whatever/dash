{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dash-redis
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  serviceName: dash-redis
  replicas: 1
  selector:
    matchLabels:
      app: dash-redis
  template:
    metadata:
      labels:
        app: dash-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # AOF so queued jobs survive a restart. Nango shares this instance
          # for its own cache and locks.
          args: [--appendonly, "yes", --appendfsync, everysec, --dir, /data]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.redis.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: dash-redis
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  selector:
    app: dash-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
