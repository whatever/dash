apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash-api
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: dash-api
  template:
    metadata:
      labels:
        app: dash-api
    spec:
      initContainers:
        # Alembic takes an advisory lock, so parallel replicas are safe.
        - name: migrate
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [dash, migrate]
          env:
            {{- include "dash.env" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [dash, serve, --host, 0.0.0.0, --port, "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "dash.env" . | nindent 12 }}
          # boto3 reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION.
          envFrom:
            - secretRef:
                name: dash-bedrock
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dash-api
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  selector:
    app: dash-api
  ports:
    - name: http
      port: 80
      targetPort: http
