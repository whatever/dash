apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash-worker
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: dash-worker
  template:
    metadata:
      labels:
        app: dash-worker
    spec:
      # A turn can run agent tools for minutes. SIGTERM stops the loop after
      # the current job; a job cut off anyway is reclaimed after 5 min idle.
      terminationGracePeriodSeconds: 300
      containers:
        - name: worker
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [dash, worker]
          env:
            {{- include "dash.env" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: dash-bedrock
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
