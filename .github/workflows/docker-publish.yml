# Build the production Dockerfile and publish it to GitHub Packages (ghcr.io).
# Push to main: tags `main`, `latest`, and `sha-<short>`.
# Push a tag `v1.2.3`: tags `1.2.3` and `1.2`.
# Pull request: build only, no push.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref cancels the older, unfinished build.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      sha-tag: ${{ steps.sha-tag.outputs.tag }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU builds the arm64 image on the amd64 runner, so the image also runs on Apple silicon.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also adds the OCI labels. `org.opencontainers.image.source` links the package to this repo.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Find sha tag
        id: sha-tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "tag=$(grep -o 'sha-[0-9a-f]*$' <<<"$TAGS" | head -1)" >> "$GITHUB_OUTPUT"

  # Package chart/ and push it to ghcr.io/whatever/charts/dash as an OCI
  # artifact. The chart version is Chart.yaml's version plus the image sha,
  # and the default image is pinned to that sha.
  publish-chart:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.outputs.sha-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package and push
        env:
          SHA_TAG: ${{ needs.publish.outputs.sha-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          version="$base-$SHA_TAG"
          sed -i -E "s#^image: .*#image: ghcr.io/${{ github.repository }}:$SHA_TAG#" chart/values.yaml
          helm lint chart
          helm package chart --version "$version" --app-version "$SHA_TAG"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dash-$version.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
